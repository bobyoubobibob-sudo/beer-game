<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Пивной Барон — Telegram Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary: #f59e0b;
      --accent: #ff0055;
      --cyan: #00f3ff;
      --bg: #090511;
      --card-bg: rgba(22, 15, 33, 0.95);
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: #fff;
      position: fixed;
      touch-action: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      max-width: 540px;
      margin: 0 auto;
      position: relative;
    }

    /* Верхняя плашка */
    .top-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(13, 8, 22, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .user-tag {
      font-size: 13px;
      font-weight: 800;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-row {
      display: flex;
      gap: 8px;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      padding: 5px 10px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .stat-val {
      font-size: 15px;
      font-weight: 900;
      color: var(--primary);
    }

    .btn-share {
      background: #2563eb;
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Игровая сцена */
    #stage-wrap {
      flex: 1.1;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Чугаметр */
    .chug-overlay {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 320px;
      background: rgba(14, 9, 23, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 14px;
      pointer-events: none;
    }

    .meter-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .meter-track {
      position: relative;
      height: 14px;
      background: #1e132b;
      border-radius: 10px;
      overflow: hidden;
    }

    .zone-sweet {
      position: absolute;
      left: 40%;
      width: 35%;
      height: 100%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .needle {
      position: absolute;
      top: -2px;
      width: 5px;
      height: 18px;
      background: #fff;
      border-radius: 3px;
      box-shadow: 0 0 8px #fff;
      transform: translateX(-50%);
      transition: left 0.04s ease-out;
    }

    .press-hint {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 800;
      color: #fcd34d;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Нижняя панель */
    .bottom-shop {
      flex: 1;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .shop-tabs {
      display: flex;
      background: #120a1b;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 11px 0;
      background: none;
      border: none;
      color: #948aa5;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--primary);
      background: rgba(245, 158, 11, 0.08);
    }

    .cards-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .card {
      background: #180f24;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon {
      font-size: 22px;
      width: 38px;
      height: 38px;
      background: #251638;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-title { font-size: 13px; font-weight: 700; }
    .card-sub { font-size: 11px; color: #a295b5; }

    .btn-buy {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 11px;
      color: #0b0711;
      cursor: pointer;
    }
    .btn-buy:disabled { background: #2b1f38; color: #635475; }
    .btn-equipped {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #10b981;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
    }

    /* Стили таблицы рейтинга */
    .lead-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #190f26;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .lead-user {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 13px;
    }
    .lead-rank {
      font-size: 16px;
      font-weight: 900;
      width: 24px;
    }
    .lead-score {
      font-weight: 900;
      color: var(--primary);
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Верхняя строка -->
  <div class="top-hud">
    <div class="user-tag">
      <span>😎</span>
      <span id="player-name">Пацан</span>
    </div>
    <div class="stats-row">
      <div class="stat-pill">
        <span>🍺</span>
        <span class="stat-val" id="hud-liters">0.0 L</span>
      </div>
      <div class="stat-pill">
        <span>💰</span>
        <span class="stat-val" id="hud-coins">0 ₽</span>
      </div>
      <button class="btn-share" onclick="inviteFriend()">➕ Друг</button>
    </div>
  </div>

  <!-- Холст игры -->
  <div id="stage-wrap">
    <div class="press-hint" id="hint-msg">ЖМИ И ДЕРЖИ В ЗЕЛЁНОЙ ЗОНЕ!</div>
    <canvas id="gameCanvas"></canvas>

    <div class="chug-overlay">
      <div class="meter-head">
        <span>ПОТОК ГЛОТКА</span>
        <span id="combo-display" style="color: var(--primary);">x1.0</span>
      </div>
      <div class="meter-track">
        <div class="zone-sweet"></div>
        <div class="needle" id="chug-needle" style="left: 0%;"></div>
      </div>
    </div>
  </div>

  <!-- Меню и Магазин -->
  <div class="bottom-shop">
    <div class="shop-tabs">
      <button class="tab-btn active" onclick="openTab('beers')">🍺 Сорта</button>
      <button class="tab-btn" onclick="openTab('mugs')">🏺 Бокалы</button>
      <button class="tab-btn" onclick="openTab('skins')">👕 Шмот</button>
      <button class="tab-btn" onclick="openTab('auto')">⚡ Авто</button>
      <button class="tab-btn" style="color: #fcd34d;" onclick="openTab('top')">🏆 ТОП</button>
    </div>
    <div class="cards-list" id="shop-container"></div>
  </div>
</div>

<script>
  // ==========================================
  // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ИЗ MOCKAPI:
  // ==========================================
  const LEADERBOARD_API = "https://6ac67a23bea0e72cf5c915cd.mockapi.io/players"; 

  // Инициализация Telegram
  const tg = window.Telegram?.WebApp;
  let tgUser = { id: "guest_" + Math.floor(Math.random()*10000), first_name: "Гость" };

  if (tg) {
    tg.ready();
    tg.expand();
    tg.enableClosingConfirmation();
    if (tg.initDataUnsafe?.user) {
      tgUser = tg.initDataUnsafe.user;
    }
  }

  document.getElementById('player-name').innerText = tgUser.first_name;

  function haptic(type = 'light') {
    if (tg?.HapticFeedback) {
      if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
      else tg.HapticFeedback.impactOccurred(type);
    }
  }

  // Кнопка «Позвать друга»
  function inviteFriend() {
    const botUrl = "https://t.me/share/url?url=" + encodeURIComponent("https://t.me/" + (tg?.initDataUnsafe?.bot?.username || "beer_game_bot")) + "&text=" + encodeURIComponent("🍺 Залетай в Пивной Барон! Попробуй перепить мой рекорд!");
    if (tg) tg.openTelegramLink(botUrl);
    else window.open(botUrl, '_blank');
  }

  // Звук глотка
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  function playGulpSound() {
    if (!actx) actx = new AudioCtx();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.frequency.setValueAtTime(190, actx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(70, actx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.2, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start();
    osc.stop(actx.currentTime + 0.11);
  }

  const STATE = {
    liters: 0,
    coins: 10,
    chugPower: 0,
    isPressing: false,
    chokeTimer: 0,
    combo: 1,
    curBeer: 'lager',
    curMug: 'glass',
    curSkin: 'hoodie',
    autoLps: 0
  };

  const BEERS = {
    lager: { name: "Жигулёвское", cost: 0, mult: 1, color: "#f59e0b", foam: "#fff", icon: "🍺", owned: true },
    dark: { name: "Тёмный Стаут", cost: 150, mult: 4, color: "#1f1209", foam: "#d4b08c", icon: "☕", owned: false },
    sour: { name: "Вишнёвый Саур", cost: 800, mult: 15, color: "#e11d48", foam: "#fecdd3", icon: "🍒", owned: false },
    cyber: { name: "Кибер-Эль 2077", cost: 4000, mult: 60, color: "#00f3ff", foam: "#67e8f9", icon: "⚡", owned: false }
  };

  const MUGS = {
    glass: { name: "Гранёный Стакан", cost: 0, mult: 1, icon: "🥛", owned: true },
    stein: { name: "Дубовая Кружка", cost: 200, mult: 3, icon: "🍺", owned: false },
    horn: { name: "Рог Викинга", cost: 1200, mult: 12, icon: "📯", owned: false },
    gold: { name: "Золотой Кубок", cost: 6000, mult: 45, icon: "🏆", owned: false }
  };

  const SKINS = {
    hoodie: { name: "Черное Худи", cost: 0, color: "#18181b", glow: "#71717a", icon: "🧥", owned: true },
    leather: { name: "Косуха Рокера", cost: 300, color: "#09090b", glow: "#f43f5e", icon: "🎸", owned: false },
    miami: { name: "Гавайка Майами", cost: 1500, color: "#06b6d4", glow: "#f43f5e", icon: "🌺", owned: false },
    suit: { name: "Смокинг Босса", cost: 5000, color: "#000000", glow: "#f59e0b", icon: "🤵", owned: false }
  };

  const AUTO = [
    { id: 'tube', name: 'Авто-трубочка', cost: 50, lps: 0.2, count: 0, icon: '🥤' },
    { id: 'friend', name: 'Друган с пивом', cost: 300, lps: 1.5, count: 0, icon: '🧔' }
  ];

  let activeTab = 'beers';

  // Холст
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let w, h;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    w = canvas.width = rect.width * (window.devicePixelRatio || 1);
    h = canvas.height = rect.height * (window.devicePixelRatio || 1);
  }
  window.addEventListener('resize', resize);
  resize();

  function drawGuy() {
    ctx.clearRect(0, 0, w, h);
    const cx = w * 0.5;
    const cy = h * 0.65;
    const s = Math.min(w, h) / 360;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);

    const isDrinking = STATE.chugPower > 30;
    const skin = SKINS[STATE.curSkin];
    const beer = BEERS[STATE.curBeer];

    // Тело
    ctx.beginPath();
    ctx.moveTo(-60, 20); ctx.lineTo(60, 20); ctx.lineTo(50, 160); ctx.lineTo(-50, 160);
    ctx.closePath();
    ctx.fillStyle = skin.color;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = skin.glow;
    ctx.stroke();

    // Шея
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(-18, -25, 36, 50);

    // Голова
    ctx.save();
    ctx.translate(0, -50);
    if (isDrinking) ctx.rotate(-0.15);

    ctx.beginPath();
    ctx.ellipse(0, 0, 34, 40, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fbbf24';
    ctx.fill();

    // Борода
    ctx.beginPath();
    ctx.arc(0, 10, 30, 0, Math.PI);
    ctx.fillStyle = '#27170e';
    ctx.fill();

    // Очки
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(-32, -15, 28, 18);
    ctx.fillRect(4, -15, 28, 18);
    ctx.fillStyle = 'rgba(0, 243, 255, 0.4)';
    ctx.fillRect(-28, -12, 10, 12);
    ctx.fillRect(8, -12, 10, 12);

    if (isDrinking) {
      ctx.beginPath();
      ctx.ellipse(0, 20, 10, 8, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#5c1010';
      ctx.fill();
    }
    ctx.restore();

    // Рука с бокалом
    ctx.save();
    ctx.translate(isDrinking ? -10 : 35, isDrinking ? -65 : 40);

    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(-20, -25, 40, 60);
    ctx.fillRect(-20, -25, 40, 60);

    ctx.fillStyle = beer.color;
    ctx.fillRect(-18, -10, 36, 43);

    ctx.fillStyle = beer.foam;
    ctx.beginPath();
    ctx.ellipse(0, -10, 18, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    ctx.restore();
  }

  // Главный цикл
  let lastT = performance.now();
  function loop(now) {
    const dt = now - lastT;
    lastT = now;

    if (STATE.chokeTimer > 0) {
      STATE.chokeTimer -= dt;
      STATE.chugPower = 0;
      document.getElementById('hint-msg').innerText = "ПОПЕРХНУЛСЯ! ДЫШИ...";
      document.getElementById('hint-msg').style.color = "#ef4444";
    } else if (STATE.isPressing) {
      STATE.chugPower = Math.min(100, STATE.chugPower + dt * 0.12);

      if (STATE.chugPower > 95) {
        STATE.chokeTimer = 1500;
        haptic('error');
      } else {
        const isSweet = STATE.chugPower >= 40 && STATE.chugPower <= 75;
        const b = BEERS[STATE.curBeer];
        const m = MUGS[STATE.curMug];

        if (isSweet) {
          STATE.combo = Math.min(5, STATE.combo + 0.01);
          document.getElementById('hint-msg').innerText = "🔥 ИДЕАЛЬНЫЙ ПОТОК! 🔥";
          document.getElementById('hint-msg').style.color = "#10b981";
        } else {
          document.getElementById('hint-msg').innerText = "ЖМИ И ДЕРЖИ В ЗЕЛЁНОЙ ЗОНЕ!";
          document.getElementById('hint-msg').style.color = "#fcd34d";
        }

        const added = (0.002 * m.mult * (isSweet ? 2.5 : 1.0));
        STATE.liters += added;
        STATE.coins += added * 15 * b.mult * STATE.combo;

        if (Math.random() < 0.25) {
          playGulpSound();
          haptic('light');
        }
      }
    } else {
      STATE.chugPower = Math.max(0, STATE.chugPower - dt * 0.1);
      STATE.combo = 1;
      document.getElementById('hint-msg').innerText = "ЖМИ И ДЕРЖИ ЭКРАН!";
      document.getElementById('hint-msg').style.color = "#fcd34d";
    }

    STATE.liters += STATE.autoLps * (dt / 1000);
    STATE.coins += STATE.autoLps * 5 * (dt / 1000);

    document.getElementById('hud-liters').innerText = STATE.liters.toFixed(1) + ' L';
    document.getElementById('hud-coins').innerText = Math.floor(STATE.coins).toLocaleString() + ' ₽';
    document.getElementById('chug-needle').style.left = STATE.chugPower + '%';
    document.getElementById('combo-display').innerText = 'x' + STATE.combo.toFixed(1);

    drawGuy();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Тач события
  const stage = document.getElementById('stage-wrap');
  stage.addEventListener('pointerdown', (e) => { e.preventDefault(); STATE.isPressing = true; });
  window.addEventListener('pointerup', () => { STATE.isPressing = false; });
  window.addEventListener('pointercancel', () => { STATE.isPressing = false; });

  // Сохранение рекорда на общий сервер каждые 10 секунд
  setInterval(() => {
    if (STATE.liters > 0.5 && LEADERBOARD_API.includes("http")) {
      syncScoreToCloud();
    }
  }, 10000);

  async function syncScoreToCloud() {
    try {
      // Ищем, есть ли уже этот игрок
      const res = await fetch(`${LEADERBOARD_API}?tg_id=${tgUser.id}`);
      const data = await res.json();
      if (data && data.length > 0) {
        const p = data[0];
        if (STATE.liters > p.liters) {
          await fetch(`${LEADERBOARD_API}/${p.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ liters: parseFloat(STATE.liters.toFixed(1)) })
          });
        }
      } else {
        await fetch(LEADERBOARD_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tg_id: String(tgUser.id),
            name: tgUser.first_name || "Пацан",
            liters: parseFloat(STATE.liters.toFixed(1))
          })
        });
      }
    } catch(e) {}
  }

  // Рендер вкладок
  function openTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.currentTarget.classList.add('active');
    renderShop();
  }

  async function renderShop() {
    const cont = document.getElementById('shop-container');
    cont.innerHTML = '';

    if (activeTab === 'top') {
      cont.innerHTML = '<div style="text-align:center; padding:20px; font-size:12px; color:#888;">Загрузка топа баронов...</div>';
      try {
        const res = await fetch(`${LEADERBOARD_API}?sortBy=liters&order=desc`);
        const players = await res.json();
        cont.innerHTML = '';

        if (!players || players.length === 0) {
          cont.innerHTML = '<div style="text-align:center; padding:20px; font-size:12px;">Пока никто не выпил. Сделай первый глоток!</div>';
          return;
        }

        const medals = ["🥇", "🥈", "🥉"];
        players.slice(0, 10).forEach((p, idx) => {
          const rank = medals[idx] || (idx + 1);
          cont.innerHTML += `
            <div class="lead-row">
              <div class="lead-user">
                <span class="lead-rank">${rank}</span>
                <span>${p.name}</span>
              </div>
              <div class="lead-score">${p.liters} L</div>
            </div>
          `;
        });
      } catch (e) {
        cont.innerHTML = '<div style="text-align:center; padding:20px; font-size:12px; color:#ef4444;">Не удалось загрузить топ. Проверь ссылку API в настройках!</div>';
      }
      return;
    }

    if (activeTab === 'beers') {
      Object.keys(BEERS).forEach(k => {
        const item = BEERS[k];
        const isEq = STATE.curBeer === k;
        cont.innerHTML += makeCard(item.name, `Множитель: x${item.mult}`, item.icon, item.cost, isEq, item.owned, `setEq('beer','${k}')`, `buy('beer','${k}')`);
      });
    } else if (activeTab === 'mugs') {
      Object.keys(MUGS).forEach(k => {
        const item = MUGS[k];
        const isEq = STATE.curMug === k;
        cont.innerHTML += makeCard(item.name, `Объем глотка: x${item.mult}`, item.icon, item.cost, isEq, item.owned, `setEq('mug','${k}')`, `buy('mug','${k}')`);
      });
    } else if (activeTab === 'skins') {
      Object.keys(SKINS).forEach(k => {
        const item = SKINS[k];
        const isEq = STATE.curSkin === k;
        cont.innerHTML += makeCard(item.name, `Стиль пацана`, item.icon, item.cost, isEq, item.owned, `setEq('skin','${k}')`, `buy('skin','${k}')`);
      });
    } else if (activeTab === 'auto') {
      AUTO.forEach(a => {
        cont.innerHTML += `
          <div class="card">
            <div class="card-meta">
              <div class="card-icon">${a.icon}</div>
              <div>
                <div class="card-title">${a.name} (${a.count})</div>
                <div class="card-sub">+${a.lps} L/сек</div>
              </div>
            </div>
            <button class="btn-buy" ${STATE.coins < a.cost ? 'disabled' : ''} onclick="buyAuto('${a.id}')">${a.cost} ₽</button>
          </div>
        `;
      });
    }
  }

  function makeCard(title, sub, icon, cost, isEq, owned, eqFn, buyFn) {
    let btn = '';
    if (isEq) btn = `<div class="btn-equipped">В руках</div>`;
    else if (owned) btn = `<button class="btn-buy" onclick="${eqFn}">Надеть</button>`;
    else btn = `<button class="btn-buy" ${STATE.coins < cost ? 'disabled' : ''} onclick="${buyFn}">${cost} ₽</button>`;

    return `
      <div class="card">
        <div class="card-meta">
          <div class="card-icon">${icon}</div>
          <div>
            <div class="card-title">${title}</div>
            <div class="card-sub">${sub}</div>
          </div>
        </div>
        ${btn}
      </div>
    `;
  }

  window.buy = function(type, id) {
    let item = (type === 'beer' ? BEERS : type === 'mug' ? MUGS : SKINS)[id];
    if (STATE.coins >= item.cost && !item.owned) {
      STATE.coins -= item.cost;
      item.owned = true;
      setEq(type, id);
    }
  };

  window.setEq = function(type, id) {
    if (type === 'beer') STATE.curBeer = id;
    if (type === 'mug') STATE.curMug = id;
    if (type === 'skin') STATE.curSkin = id;
    haptic('medium');
    renderShop();
  };

  window.buyAuto = function(id) {
    const item = AUTO.find(x => x.id === id);
    if (STATE.coins >= item.cost) {
      STATE.coins -= item.cost;
      item.count++;
      STATE.autoLps += item.lps;
      item.cost = Math.floor(item.cost * 1.4);
      haptic('medium');
      renderShop();
    }
  };

  renderShop();
</script>
</body>
</html>
